<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Fort</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col overflow-hidden">
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div id="app" class="flex h-screen w-screen overflow-hidden">
        <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0 transition-all duration-300 z-30 md:relative absolute inset-y-0 left-0 -translate-x-full md:translate-x-0">
            <div>
                <div class="h-16 flex items-center px-6 border-b border-slate-800 gap-3">
                    <div class="bg-danger-600 text-white p-2 rounded-xl shadow-lg shadow-danger-600/30 flex items-center justify-center font-bold text-lg">
                        <i data-lucide="shield" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-slate-100 tracking-tight text-sm uppercase">Shoaib's Empire</h1>
                        <span class="text-xs text-danger-500 font-semibold tracking-wider">COMMAND CENTER</span>
                    </div>
                </div>
                <nav class="p-4 space-y-1 overflow-y-auto max-h-[calc(100vh-140px)] custom-scrollbar" id="nav-links"></nav>
            </div>

            <div class="p-4 border-t border-slate-800 bg-slate-900/50 flex items-center justify-between">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-9 h-9 rounded-full bg-slate-800 text-danger-500 font-bold flex items-center justify-center shrink-0 border border-slate-700" id="user-avatar">U</div>
                    <div class="truncate">
                        <p class="text-sm font-medium text-slate-200 truncate" id="user-display-name">Commander</p>
                        <p class="text-xs text-slate-400 truncate" id="user-email-display">local@user.com</p>
                    </div>
                </div>
                <button onclick="logout()" title="Logout" class="text-slate-400 hover:text-danger-400 p-2 rounded-lg hover:bg-slate-800 transition">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </aside>

        <div class="flex-1 flex flex-col min-w-0 bg-slate-950 overflow-hidden">
            <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0 z-20">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    <div>
                        <h2 id="page-title" class="text-lg font-bold text-white tracking-tight">Dashboard</h2>
                        <p id="page-subtitle" class="text-xs text-slate-400">Welcome back to your tactical productivity suite.</p>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <div onclick="navigateTo('Register Office')" class="cursor-pointer bg-danger-950/80 border border-danger-700/50 hover:border-danger-500 px-3 py-1.5 rounded-xl flex items-center gap-2 shadow-md shadow-danger-900/20 transition group">
                        <span class="w-2.5 h-2.5 rounded-full bg-danger-500 animate-pulse"></span>
                        <span class="text-xs font-bold text-danger-300 tracking-wide uppercase">Shoaib's Empire:</span>
                        <span id="header-atogoti-count" class="text-xs font-black text-white bg-danger-800/80 px-2 py-0.5 rounded-lg group-hover:bg-danger-700 transition">47</span>
                    </div>

                    <div class="hidden lg:flex items-center gap-2 text-xs font-medium text-slate-300 bg-slate-800/60 px-3 py-2 rounded-xl border border-slate-700/50">
                        <i data-lucide="calendar" class="w-3.5 h-3.5 text-danger-400"></i>
                        <span id="header-current-date">--</span>
                    </div>
                </div>
            </header>

            <main id="main-content" class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 bg-slate-950 relative"></main>
        </div>
    </div>

    <div id="modal-container"></div>

    <script src="./script.js"></script>
</body>
</html>
